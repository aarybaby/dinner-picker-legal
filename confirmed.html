<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Email confirmed | PARSLIA</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           padding:24px; background:#FFF6F0; color:#2F2937;
           font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { max-width:460px; text-align:center; }
    .logo { color:#FF7A00; font-weight:800; font-size:28px; letter-spacing:.08em; }
    h1 { font-size:30px; margin:24px 0 8px; }
    p { color:#6B7280; line-height:1.6; }
    a.btn { display:none; margin-top:20px; background:#FF7A00; color:#fff; text-decoration:none;
            font-weight:700; padding:14px 28px; border-radius:999px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">PARSLIA.</div>
    <h1 id="title">Email confirmed</h1>
    <p id="message">Your email is confirmed. Open the PARSLIA app and sign in.</p>
    <a id="open" class="btn" href="#">Open PARSLIA</a>
  </main>
  <script>
    (function () {
      var hash = window.location.hash.replace(/^#/, '');
      var params = new URLSearchParams(hash);
      if (params.get('error')) {
        document.getElementById('title').textContent = 'This link did not work';
        document.getElementById('message').textContent =
          params.get('error_code') === 'otp_expired'
            ? 'This link has expired or was already used. Open the app and try signing in. If that fails, sign up again to get a new email.'
            : 'Something went wrong. Open the app and try signing in, or contact support.';
      } else if (params.get('access_token') && params.get('refresh_token')) {
        var link = document.getElementById('open');
        link.href = 'parslia://auth/callback#' + hash;
        link.style.display = 'inline-block';
      }
      history.replaceState(null, '', window.location.pathname);
    })();
  </script>
</body>
</html>
