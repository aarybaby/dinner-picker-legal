<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #FFD1A3; margin: 0; padding: 24px; color: #2F2937; }
    .card { max-width: 400px; margin: 40px auto; }
    input { width: 100%; box-sizing: border-box; padding: 14px 16px; font-size: 16px; border: 0; border-radius: 14px; background: #F5F5F5; margin-bottom: 12px; }
    button { width: 100%; padding: 15px; font-size: 16px; font-weight: 700; color: #fff; background: #FF7A00; border: 0; border-radius: 14px; cursor: pointer; }
    #msg { margin-top: 12px; line-height: 1.4; }
    label { display: block; margin-bottom: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <form id="form" hidden>
      <input id="pw" type="password" placeholder="New password" minlength="6" required>
      <label><input type="checkbox" id="show" style="width:auto;margin-right:6px"> Show password</label>
      <button type="submit">Update password</button>
    </form>
    <p id="msg">Checking your reset link…</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    const sb = supabase.createClient('https://btghonxfyhbauxczqjft.supabase.co', 'sb_publishable_WYUjxjDx_poty-PFMWxcrQ_E2bMqQa4', {
      auth: { detectSessionInUrl: false }
    });
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    msg.textContent = 'Page v2 | ' + location.search;

    function showForm() { form.hidden = false; msg.textContent = ''; }
    function showError(t) { form.hidden = true; msg.textContent = t; }

    (async () => {
      const h = new URLSearchParams(location.hash.slice(1));
      const q = new URLSearchParams(location.search);

      const errCode = h.get('error_code') || q.get('error_code');
      if (errCode || h.get('error')) {
        const desc = h.get('error_description') || q.get('error_description') || '';
        return showError('Reset link problem (' + (errCode || h.get('error')) + '): ' + desc + ' Request a new reset email from the app.');
      }

      const at = h.get('access_token');
      const rt = h.get('refresh_token');
      if (at && rt) {
        const { error } = await sb.auth.setSession({ access_token: at, refresh_token: rt });
        if (error) return showError(error.message);
        history.replaceState(null, '', location.pathname);
        return showForm();
      }

      const th = q.get('token_hash');
      if (th) {
        const { error } = await sb.auth.verifyOtp({ token_hash: th, type: q.get('type') || 'recovery' });
        if (error) return showError(error.message + ' Request a new reset email from the app.');
        history.replaceState(null, '', location.pathname);
        return showForm();
      }
      
      if (q.get('code')) {
        const { error } = await sb.auth.exchangeCodeForSession(q.get('code'));
        if (error) return showError(error.message);
        history.replaceState(null, '', location.pathname);
        return showForm();
      }

      const { data } = await sb.auth.getSession();
      if (data.session) return showForm();
      showError('No reset token found in this link. Request a new reset email from the app.');
    })();

    document.getElementById('show').addEventListener('change', e => {
      document.getElementById('pw').type = e.target.checked ? 'text' : 'password';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.updateUser({ password: document.getElementById('pw').value });
      if (error) { msg.textContent = error.message; return; }
      form.hidden = true;
      msg.textContent = 'Password updated. You can close this page and sign in to the app with your new password.';
    });
  </script>
</body>
</html>
